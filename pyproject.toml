[project]
name = "smolstuff"
version = "0.2.0"
description = "Deterministic core for the smolstuff operations demo."
requires-python = ">=3.9"
dependencies = ["psycopg[binary]>=3.2", "groq>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.vercel]
entrypoint = "app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.setuptools.package-data]
smolstuff = ["connector_fixtures/*.json"]
