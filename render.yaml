services:
  - type: web
    name: smolstuff
    runtime: python
    plan: free
    buildCommand: "python -m compileall src"
    startCommand: "PYTHONPATH=src python -m smolstuff.inbox"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: DEMO_COOKIE_SECURE
        value: "1"
