name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SMOL_SPONSOR_CALLS: "0"
  DATABASE_URL: ""

jobs:
  sqlite:
    name: SQLite / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<9" "psycopg[binary]>=3.2,<4" "groq>=1,<2"
      - name: Check patch whitespace
        run: git show --format= --check HEAD
      - name: Run offline SQLite suite
        env:
          PGHOST: /tmp/smolstuff-no-postgres
          PGCONNECT_TIMEOUT: "2"
        run: >-
          python -m pytest -q
          --ignore=tests/test_postgres_store.py
          --ignore=tests/test_demo_expiry_postgres.py
          --ignore=tests/test_sponsor_budget_postgres.py
          --ignore=tests/test_shop_migrations_postgres.py

  postgres:
    name: PostgreSQL 16 / Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<9" "psycopg[binary]>=3.2,<4" "groq>=1,<2"
      - name: Install disposable database tools
        run: sudo apt-get update && sudo apt-get install --yes postgresql-16
      - name: Run full suite with disposable Postgres
        run: python scripts/check_postgres.py --pg-bin /usr/lib/postgresql/16/bin
